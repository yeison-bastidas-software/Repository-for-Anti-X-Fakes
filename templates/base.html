{# Base template shared by all screens: navbar, content block and
   mandatory footer disclaimer. #}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1512">
  <title>{% block title %}Anti X-Fakes{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-dark py-3">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('home') }}">🛡 Anti X-Fakes</a>
    </div>
  </nav>

  <main class="container flex-grow-1 py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center py-3">
    <div class="container disclaimer">AI-assisted verdict, not absolute truth.</div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
