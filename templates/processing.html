{# Processing screen: progress bar 0-100% driven by REAL backend stage status #}
{% extends "base.html" %}
{% block title %}Anti X-Fakes — Investigating…{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card card-dark p-4 p-md-5 mt-5 text-center">
      <h2 class="h4 mb-4" style="color:var(--mint)">Investigating the post…</h2>

      <div class="progress mb-3" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="bar" class="progress-bar" style="width:0%">0%</div>
      </div>

      <p class="status-text fs-5" id="status" style="color:var(--mint)">Starting investigation…</p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const token = {{ token | tojson }};
  const bar = document.getElementById('bar');
  const statusEl = document.getElementById('status');

  function tick() {
    fetch('/progress?token=' + encodeURIComponent(token))
      .then(response => response.json())
      .then(job => {
        const pct = job.percent;
        bar.style.width = pct + '%';
        bar.textContent = pct + '%';
        if (job.status) statusEl.textContent = job.status;

        if (job.done) {
          if (job.error) {
            statusEl.textContent = job.error;
            statusEl.style.color = 'var(--false, #e74c3c)';
            setTimeout(() => { window.location.href = '/'; }, 5000);
          } else {
            window.location.href = '/result?post_id=' + encodeURIComponent(job.post_id);
          }
          return;
        }
        setTimeout(tick, 800);
      })
      .catch(() => setTimeout(tick, 1500));
  }
  tick();
</script>
{% endblock %}
